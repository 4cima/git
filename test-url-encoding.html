<!DOCTYPE html>
<html>
<head>
    <title>URL Encoding Test</title>
</head>
<body>
    <h1>URL Encoding Test for & character in genre slugs</h1>
    
    <h2>Test Cases:</h2>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Test 1: Direct href construction (what Link component does)
        const slug1 = 'action-&-adventure';
        const url1 = `/series?genre=${slug1}`;
        results.innerHTML += `<h3>Test 1: Direct construction</h3>`;
        results.innerHTML += `<p>Slug: ${slug1}</p>`;
        results.innerHTML += `<p>URL: ${url1}</p>`;
        results.innerHTML += `<p>Problem: & becomes query separator - BREAKS!</p>`;
        results.innerHTML += `<p>Browser would parse as: /series?genre=action-  with separate "adventure" param</p>`;
        
        // Test 2: Proper encoding with encodeURIComponent
        const slug2 = 'action-&-adventure';
        const url2 = `/series?genre=${encodeURIComponent(slug2)}`;
        results.innerHTML += `<h3>Test 2: With encodeURIComponent</h3>`;
        results.innerHTML += `<p>Slug: ${slug2}</p>`;
        results.innerHTML += `<p>URL: ${url2}</p>`;
        results.innerHTML += `<p>Result: & becomes %26 - WORKS!</p>`;
        
        // Test 3: Reading back with URLSearchParams
        const testUrl = new URL('http://localhost:3000/series?genre=action-%26-adventure');
        const params = new URLSearchParams(testUrl.search);
        const genreParam = params.get('genre');
        results.innerHTML += `<h3>Test 3: Reading back with URLSearchParams</h3>`;
        results.innerHTML += `<p>URL: ${testUrl.href}</p>`;
        results.innerHTML += `<p>Parsed genre param: ${genreParam}</p>`;
        results.innerHTML += `<p>Result: Correctly decodes back to: ${genreParam === 'action-&-adventure' ? 'action-&-adventure ✅' : 'WRONG ❌'}</p>`;
        
        // Test 4: What happens with unencoded &
        const testUrl2 = new URL('http://localhost:3000/series?genre=action-&-adventure');
        const params2 = new URLSearchParams(testUrl2.search);
        const genreParam2 = params2.get('genre');
        const adventureParam2 = params2.get('-adventure');
        results.innerHTML += `<h3>Test 4: Unencoded & (BROKEN)</h3>`;
        results.innerHTML += `<p>URL: ${testUrl2.href}</p>`;
        results.innerHTML += `<p>genre param: "${genreParam2}"</p>`;
        results.innerHTML += `<p>-adventure param: "${adventureParam2}"</p>`;
        results.innerHTML += `<p>Result: & acts as separator, splits into two params ❌</p>`;
    </script>
</body>
</html>
