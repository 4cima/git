name: D1 Daily Backup

# نسخ احتياطي يومي لجداول D1 — 2 صباحًا UTC + إمكانية التشغيل اليدوي
# ⚠️ ملاحظة: GitHub يشغّل الـ schedule فقط للـ workflows الموجودة على الفرع الافتراضي (main)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Backup D1 tables (gzip + keep last 7)
      run: node scripts/backup-d1.js
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Show backup summary
      run: cat data/backups/d1/*/manifest.json

    - name: Upload backup artifact (30 days retention)
      uses: actions/upload-artifact@v4
      with:
        name: d1-backup-${{ github.run_id }}
        path: data/backups/d1/**/*.json.gz
        retention-days: 30
        if-no-files-found: error

    # اختياري: رفع إلى Cloudflare R2 — يعمل فقط إذا أُضيف سكرت R2_BUCKET
    - name: Upload to R2 (optional)
      if: ${{ secrets.R2_BUCKET != '' }}
      run: node scripts/backup-d1-to-r2.js
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
